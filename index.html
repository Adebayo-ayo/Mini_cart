<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="col-9 col-lg-6 col-md-5 mx-auto mt-4 shadow p-4">
      <h2 class="text-center text-decoration-underline py-3">
        Mini Shopping Cart
      </h2>
      <input
        id="input"
        type="text"
        placeholder="Enter your Item here"
        class="form-control form-control-sm shadow-none"
      />
      <button onclick="addItem()" class="w-100 btn btn-success mt-3">
        Add Item
      </button>

      <button onclick="deleteLast()" class="w-100 btn btn-danger mt-3">
        Delete Last Added
      </button>
      <button onclick="deleteAll()" class="w-100 btn btn-secondary mt-3">
        Clear cart
      </button>
            <div id="display" class="text-center nt-2">Your item will show here</div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
